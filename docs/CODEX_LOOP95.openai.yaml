interface:
  display_name: "Desloppify Loop95"
  short_description: "Raise strict score to 95 with a hook-enforced fix loop."
  default_prompt: "Use $desloppify-loop95 to inspect the current repo state, run `desloppify scan --path .`, refresh review when needed, and keep looping on `desloppify next`, fixing, resolving, rescanning, and checking `desloppify status` until strict >= 95.0. If you are genuinely blocked and must stop, prefix the final response with `LOOP95_BLOCKED:` and include the exact command, exact error, and current strict score."

policy:
  allow_implicit_invocation: false
