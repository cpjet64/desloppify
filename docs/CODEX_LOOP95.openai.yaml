interface:
  display_name: "Desloppify Loop95"
  short_description: "Raise strict score to 95 with a hook-enforced fix loop."
  default_prompt: "Use $desloppify-loop95 to inspect the current repo state, run `desloppify scan --path .`, check `desloppify status`, and stop only if strict >= 95.0 and review is fresh. If the repo is still below target, run subjective review for this scan cycle, then keep working the living plan via `desloppify next`. When the execution queue empties, run `desloppify plan queue`, follow its exact empty-state guidance, and if promotable backlog remains use the suggested `desloppify plan promote ...` command before continuing; when the current work chunk is exhausted, rescan and repeat. If you are genuinely blocked and must stop, prefix the final response with `LOOP95_BLOCKED:` and include the exact command, exact error, and current strict score."

policy:
  allow_implicit_invocation: false
